services:
  postgres:
    image: postgres:16-alpine
    container_name: btc-dca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: btc_dca
      POSTGRES_PASSWORD: btc_dca
      POSTGRES_DB: btc_dca
    ports:
      - "5432:5432"
    volumes:
      - btc_dca_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc_dca -d btc_dca"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  btc_dca_pgdata:
